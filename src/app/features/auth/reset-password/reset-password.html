<div class="auth-container">
  <div class="glass-panel login-card">
    
    <div class="card-header">
      <h2>Criar Nova Senha</h2>
      <p>Digite sua nova senha abaixo</p>
    </div>

    <form class="login-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      
      <div class="input-group">
        <label for="newPassword">Nova Senha</label>
        <input 
          type="password" 
          id="newPassword" 
          formControlName="newPassword"
          class="glass-input" 
          placeholder="Crie uma senha forte" 
        />
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirmar Nova Senha</label>
        <input 
          type="password" 
          id="confirmPassword" 
          formControlName="confirmPassword"
          class="glass-input" 
          placeholder="Repita sua senha" 
        />
        <small class="error-text" *ngIf="resetForm.get('confirmPassword')?.touched && resetForm.hasError('mismatch')">
          As senhas não coincidem.
        </small>
      </div>
      
      <button type="submit" class="glass-btn primary-btn" [disabled]="resetForm.invalid">Alterar Senha</button>
    </form>

  </div>
</div>
