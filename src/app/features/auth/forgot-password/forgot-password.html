<div class="auth-container">
  <div class="glass-panel login-card">
    
    <div class="card-header">
      <h2>Recuperar Senha</h2>
      <p>Enviaremos um link para o seu e-mail</p>
    </div>

    <form *ngIf="!isSubmitted" class="login-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">E-mail cadastrado</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email"
          class="glass-input" 
          placeholder="Digite seu e-mail" 
        />
      </div>
      <button type="submit" class="glass-btn primary-btn" [disabled]="forgotForm.invalid">Enviar Link</button>
      
      <div class="auth-links" style="text-align: center; margin-top: 15px;">
        <a routerLink="/login" style="color: #ccc; text-decoration: none; font-size: 0.9rem;">Voltar para o Login</a>
      </div>
    </form>

    <div *ngIf="isSubmitted" style="text-align: center; color: white;">
      <h3 style="color: #4ade80;">E-mail enviado!</h3>
      <p style="margin-top: 10px;">Se o e-mail existir em nossa base, você receberá um link de recuperação em instantes.</p>
      <button routerLink="/login" class="glass-btn" style="margin-top: 20px;">Voltar ao Início</button>
    </div>

  </div>
</div>
